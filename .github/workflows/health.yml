# .github/workflows/health.yml
#
# Fails when the index has stopped describing reality.
#
# A sync that silently stops working looks exactly like a quiet organization: the
# files do not change, every run is green, and nobody notices until someone looks
# for a repository that was created months ago. This workflow is the thing that
# notices.
#
# It runs `scripts/sync.py --check`, which reconciles against GitHub and exits 1 on
# any drift. It does NOT fix anything - the scheduled job does that. Its only job
# is to be red, because a red run is the one signal that survives being ignored.

name: Index health

on:
  schedule:
    # Daily, and deliberately not on the sync's own schedule: if the sync is what
    # is broken, a check that runs right after it would race it and pass on a
    # half-written state.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare the index with the organization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 tests/test_sync.py

      - name: Check for drift
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: ${{ vars.SYNC_ORG || 'vortaforge' }}
        run: |
          set -euo pipefail
          set +e
          output="$(python3 scripts/sync.py --org "$ORG" --check 2>&1)"
          status=$?
          set -e

          {
            echo "### Index health"
            echo
            echo '```json'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 2 ]; then
            echo "::error::The reconciliation itself failed (likely the token)."
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "::error::index.json is stale. The next scheduled sync will fix it;"
            echo "::error::if this run keeps being red, the sync is not running."
            exit 1
          fi
          echo "Index matches the organization."
