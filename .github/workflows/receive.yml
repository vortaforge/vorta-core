# .github/workflows/receive.yml
#
# Turns an authenticated event into a ledger entry, then lets the sync catch up.
#
# This exists for the case where the webhook path is available but the scheduled
# sweep is too slow to be the only answer: a repository deleted now should appear
# in the ledger now, not in six hours. The payload arrives either as a
# repository_dispatch (sent by the org automation, already authenticated by the
# token that sent it) or as a manual dispatch with the fields filled in.
#
# The signature check lives in scripts/receive_event.py and is used when the same
# script runs as a webhook service. Here there is no webhook hop to sign, so the
# trust boundary is the API token - which is why this workflow accepts nothing
# from `client_payload` except the four fields it validates.

name: Record repository event

on:
  repository_dispatch:
    types: [repo-changed, repo-created, repo-deleted]
  workflow_dispatch:
    inputs:
      type:
        description: "Event type"
        type: choice
        options: [created, deleted, changed, archived, unarchived, renamed, visibility]
        required: true
      repo:
        description: "Repository name (no owner prefix)"
        type: string
        required: true
      detail:
        description: "One line of context"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # Same group as sync.yml: both write events.log, and two writers appending
  # concurrently would race on the push.
  group: vorta-core-sync
  cancel-in-progress: false

jobs:
  record:
    name: Append to the ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Resolve the event
        id: event
        env:
          # Everything comes through the environment, never interpolated into the
          # shell line: a `detail` containing `$(...)` must be data, not code.
          TYPE: ${{ github.event.client_payload.type || inputs.type }}
          REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          DETAIL: ${{ github.event.client_payload.detail || inputs.detail }}
        run: |
          set -euo pipefail
          if [ -z "${TYPE:-}" ] || [ -z "${REPO:-}" ]; then
            echo "::error::Neither client_payload nor inputs carried a type and repo."
            exit 1
          fi
          # A repository name is a GitHub slug; anything else is a mistake or an
          # injection attempt, and the ledger is append-only so a bad line is
          # permanent.
          if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Repository name '${REPO}' is not a plain slug."
            exit 1
          fi
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Append to events.log
        env:
          TYPE: ${{ steps.event.outputs.type }}
          REPO: ${{ steps.event.outputs.repo }}
          DETAIL: ${{ github.event.client_payload.detail || inputs.detail }}
          ACTOR: ${{ github.event.sender.login || github.actor }}
        run: |
          set -euo pipefail
          python3 scripts/record_event.py \
            --type "$TYPE" --repo "$REPO" --detail "${DETAIL:-}" --actor "$ACTOR"

      - name: Commit
        env:
          TYPE: ${{ steps.event.outputs.type }}
          REPO: ${{ steps.event.outputs.repo }}
        run: |
          set -euo pipefail
          git config user.name  "vorta-core sync"
          git config user.email "sync@vortaforge.invalid"
          git add events.log
          git diff --cached --quiet && { echo "already recorded"; exit 0; }
          git commit -q -m "event: ${TYPE} ${REPO}"
          git push
          echo "- recorded \`${TYPE}\` for \`${REPO}\`" >> "$GITHUB_STEP_SUMMARY"
