# .github/workflows/ci.yml
#
# Build and verify the module packs on every push and pull request.
#
# The one thing that makes this CI different from a normal Gradle build: `packs/`
# is NOT committed. It is generated by tools/split.py from the source pack that
# lives in vortaforge/core, so a fresh checkout has nothing to build. Every job
# below therefore starts by fetching that pack and re-running the split. That is
# deliberate rather than awkward - the split is the product, and a CI that builds
# only previously generated output would never catch a regression in the splitter.
#
# What the jobs prove, in order of how much a failure would hurt:
#
#   1. The splitter still produces a valid layout from the current upstream pack.
#   2. The layout satisfies the module contract (no cycle, core names no module,
#      no module reaches into another's internals).
#   3. The split is deterministic: two runs produce byte-identical packs.
#   4. All 20 jars build.
#
# Everything runs with `contents: read`. Nothing here writes to the repository,
# so a pull request from a fork gets exactly the same treatment as a push from a
# maintainer, with no secrets in reach.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes an in-flight run. The builds are
  # short, so cancelling wastes nothing and keeps the queue honest.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The split is reproducible only if the input is pinned, so the upstream
  # reference is a variable rather than something buried in a checkout step.
  SOURCE_REPO: vortaforge/core
  SOURCE_PACK: archived/packs/macroEngine-Datapack-v26.3
  # Java 25 matches the rest of the organization. Nothing in this build compiles
  # Java, but Gradle 9 itself runs on it and a different major version here than
  # in the sibling mod project is a difference waiting to surprise someone.
  JAVA_VERSION: "25"

jobs:
  build:
    name: Split, verify, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job only reads. Keeping the token out of .git/config means a
          # later step cannot use it, which is the point.
          persist-credentials: false

      # The source pack is ~6.5 MB of the core repository. A full clone drags in
      # every mod, every archived pack and the whole build tree for one directory,
      # so this is a sparse, blob-filtered, shallow checkout of just the pack.
      - name: Fetch the source pack
        env:
          # Falls back to the workflow token when no dedicated secret is set: the
          # core repository is public, so anonymous cloning works and a fork PR
          # needs no secrets at all.
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/source-pack"
          rm -rf "$dest"
          if ! git clone --quiet --filter=blob:none --sparse --depth=1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" "$dest"; then
            echo "::error title=Cannot fetch the source pack::git clone of ${SOURCE_REPO} failed."
            echo "::error::If that repository is private now, set the SOURCE_READ_TOKEN secret."
            exit 1
          fi
          git -C "$dest" sparse-checkout set "$SOURCE_PACK"
          if [ ! -f "$dest/$SOURCE_PACK/pack.mcmeta" ]; then
            echo "::error title=Source pack missing::${SOURCE_PACK} has no pack.mcmeta."
            echo "::error::The pack was moved or renamed upstream; update SOURCE_PACK in ci.yml."
            exit 1
          fi
          echo "SOURCE_DIR=$dest/$SOURCE_PACK" >> "$GITHUB_ENV"
          echo "fetched $(find "$dest/$SOURCE_PACK" -type f | wc -l) files from ${SOURCE_REPO}/${SOURCE_PACK}"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          # The wrapper jar is committed, so its checksum is worth checking: it is
          # the one binary in this repository that a build executes.
          validate-wrappers: true

      - name: Tool self-tests
        # The splitter can delete a directory. These tests pin down that it only
        # ever deletes its own output.
        run: python3 tools/test_split_guard.py

      - name: Split
        run: |
          set -euo pipefail
          python3 tools/split.py --source "$SOURCE_DIR" --out . --in-place

      - name: Verify the module contract
        # verify.py exits 1 on any problem, so this step is the actual gate. It
        # checks references resolve, no module reaches into another's internals,
        # the core names no module, and the dependency graph is acyclic.
        run: python3 tools/verify.py --pack packs --graph

      - name: Check the split is deterministic
        # A splitter whose output depends on filesystem iteration order will
        # produce a different pack on a different machine and nobody will notice
        # until a release jar differs from the tagged source. Re-running and
        # diffing is a cheap way to make that impossible.
        run: |
          set -euo pipefail
          cp -a packs "$RUNNER_TEMP/packs-first"
          cp modules.json "$RUNNER_TEMP/modules-first.json"
          python3 tools/split.py --source "$SOURCE_DIR" --out . --in-place >/dev/null
          # modules.json is compared too: it feeds the canary's baseline, and a
          # manifest that reshuffles itself every run makes every canary red for no
          # reason. The packs alone were stable while this file was not.
          if ! cmp -s "$RUNNER_TEMP/modules-first.json" modules.json; then
            echo "::error title=Non-deterministic manifest::modules.json differs between two identical splits."
            diff "$RUNNER_TEMP/modules-first.json" modules.json | head -40
            exit 1
          fi
          if ! diff -r "$RUNNER_TEMP/packs-first" packs > "$RUNNER_TEMP/split.diff" 2>&1; then
            echo "::error title=Non-deterministic split::Two splits of the same input produced different output."
            head -40 "$RUNNER_TEMP/split.diff"
            exit 1
          fi
          echo "two splits are byte-identical"

      - name: Check the split shape against the committed baseline
        # Catches the class of change that verification cannot see: a prefix rule in
        # tools/split.py that stops matching and quietly relocates a module's files,
        # or one that starts swallowing a neighbour's. Everything still resolves, so
        # verify.py is green, and the layout is not what anyone reviewed.
        run: python3 tools/check_shape.py

      - name: Build every pack
        run: ./gradlew --no-daemon --console=plain check dist

      - name: Assert every jar is a loadable Fabric mod
        # The bug this exists for: 26 jars were produced with no fabric.mod.json
        # in any of them. They were data pack jars, so a mod loader ignored them,
        # and the build was green. `dist` already runs this via checkJars; running
        # it again here makes the failure its own named step instead of a line in
        # the build log.
        run: python3 tools/check_jars.py --dist build/dist

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### macroEngine modules"
            echo
            python3 tools/summarize.py modules.json \
              --source "${SOURCE_REPO}/${SOURCE_PACK}" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jars
        # Only from main: a pull request's jars are noise nobody downloads, and
        # artifacts count against the repository's storage quota.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macroengine-modules-${{ github.sha }}
          path: build/dist/*.jar
          retention-days: 14
          if-no-files-found: error
