// The macroEngine mod entry point.
//
// This is a *tiny* jar on purpose. Fabric requires a mod jar to declare an entry
// point class; a class named in `fabric.mod.json` is loaded, cast to
// `ModInitializer`, and called. macroEngine has nothing to do at Java level - its
// content is a data pack - so this class only has to exist and be castable.
//
// Why one jar rather than a class per mod:
//
//   * 26 identical `.class` files, one inside each mod jar, is 26 copies of the
//     same 500 bytes that a classloader cannot deduplicate.
//   * A module jar is *supposed* to be removable. If the class lived inside each
//     module, the core would need its own copy too, and "the same class present
//     in several jars" is the one situation where Java's classloader does not
//     fail loudly - it silently takes whichever it finds first.
//
// So every mod depends on this one and they all name the same class. The
// dependency is a jar-in-jar: each mod carries this inside `META-INF/jars/` and
// Fabric extracts and loads it, so there is no extra file for the user to install
// and no way to end up with a mismatched version.
//
// No Loom, no Minecraft, no Fabric API. `net.fabricmc.api.ModInitializer` is
// declared by fabric-loader, which is where the interface comes from at runtime;
// compiling against it needs nothing but the loader jar itself.
//
// This is a separate Gradle build (its own settings.gradle) because the root
// build's sub-projects are the generated packs. It is built first, and its jar is
// what the root build nests into each mod.

plugins {
    id 'java-library'
}

group = 'com.vortaforge.macroengine'
version = project.findProperty('modules_version') ?: '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    // Provided by the running loader. Never bundled: `compileOnly`, not
    // `implementation`. This is what keeps the jar small enough to nest 26 times.
    compileOnly 'net.fabricmc:fabric-loader:0.20.1'
}

jar {
    archiveBaseName = 'macroengine-bootstrap'
    // The filename is part of the path each mod declares in its jar-in-jar entry,
    // so it must not carry a version: a bump would silently invalidate all 26.
    archiveVersion = ''
}
