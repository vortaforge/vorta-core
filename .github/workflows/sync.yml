# .github/workflows/sync.yml
#
# Keeps index.json and events.log in step with the organization.
#
# Why a schedule *and* a dispatch, and not just one of them:
#
#   * The schedule is the guarantee. It runs whether or not anything else
#     cooperated, so a missed event is late rather than lost. This is the only
#     trigger that is certain to fire, because it needs nothing from the outside.
#   * repository_dispatch is the low-latency path. The org webhook (or any tool
#     with a token) can ask for a sweep the second something happens.
#
# The gap that matters: `repository_dispatch` only triggers a workflow file that
# exists on the *default branch*. So this file must live on main before the
# webhook is wired up, and a dispatch sent to a branch that does not have it
# silently does nothing.
#
# Required secret:
#   ORG_READ_TOKEN   Reads the org's repository list. Needs `repo` (or
#                    `public_repo` if every repository is public) and `read:org`.
#                    It does NOT need write access to anything: the commit below
#                    uses the workflow's own GITHUB_TOKEN.
#
# Note on what this job can and cannot see: a token that can read the org sees
# every repository in it, public and private. If it could only see public ones,
# discovery would return a short list and the reconciliation would record the
# private repositories as *deleted* - which is the one failure mode worth
# guarding against. Hence the sanity check in the "Guard" step: a listing that
# loses more than half its entries in one run is treated as a token problem and
# the run stops before writing anything.

name: Repository sync

on:
  schedule:
    # Every six hours. Chosen against the API budget rather than by feel: one run
    # is a single paginated listing, so this is nowhere near a rate limit, while
    # six hours keeps a deletion visible within a working day even if the webhook
    # path is down.
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [repo-changed, repo-created, repo-deleted]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Reconcile but do not commit"
        type: boolean
        default: false

permissions:
  contents: write   # commits the updated index and ledger

concurrency:
  # The sync writes two files and commits; two runs interleaving would produce a
  # conflicted push for no benefit. A queued run is enough.
  group: vorta-core-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile organization index
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # A token that cannot see the org produces an empty listing, and an empty
      # listing looks exactly like "every repository was deleted". Fail before the
      # comparison rather than after it.
      - name: Check the token can see the organization
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: ${{ vars.SYNC_ORG || 'vortaforge' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_READ_TOKEN is missing or empty."
            exit 1
          fi
          count="$(python3 scripts/discover.py --org "$ORG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["count"])')"
          if [ "$count" -lt 1 ]; then
            echo "::error::The token sees no repositories in ${ORG}. Refusing to run: an"
            echo "::error::empty listing would be recorded as a mass deletion."
            exit 1
          fi
          echo "token sees ${count} repositories"

      - name: Unit tests
        # Cheap, and they cover the decision logic (once-only events, deletion,
        # archived-as-its-own-type) that a green run alone would not prove.
        run: python3 tests/test_sync.py

      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: ${{ vars.SYNC_ORG || 'vortaforge' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail

          # Guard: a listing that shrinks by more than half is a token problem, not
          # a cleanup. Compare against the committed count before writing.
          previous="$(python3 -c 'import json;print(json.load(open("index.json")).get("count",0))' 2>/dev/null || echo 0)"
          current="$(python3 scripts/discover.py --org "$ORG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["count"])')"
          echo "previous=$previous current=$current"
          if [ "$previous" -ge 4 ] && [ "$current" -lt $((previous / 2)) ]; then
            echo "::error::Repository count fell from $previous to $current."
            echo "::error::That is far more likely a token/scope problem than a real"
            echo "::error::mass deletion. Nothing was written. Re-run with a working"
            echo "::error::ORG_READ_TOKEN, or fix index.json by hand if the deletion is real."
            exit 1
          fi

          if [ "$DRY_RUN" = "1" ]; then
            python3 scripts/sync.py --org "$ORG"
          else
            python3 scripts/sync.py --org "$ORG" --apply
          fi

      - name: Commit if anything changed
        if: ${{ !inputs.dry_run }}
        env:
          ORG: ${{ vars.SYNC_ORG || 'vortaforge' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json events.log; then
            echo "in sync, nothing to commit"
            echo "- no change" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "vorta-core sync"
          git config user.email "sync@vortaforge.invalid"
          git add index.json events.log
          # The message names what moved, so `git log` on this repository is a
          # readable history of the organization's shape rather than a wall of
          # "chore: sync".
          summary="$(python3 - <<'PY'
          import json, subprocess
          diff = subprocess.run(["git", "diff", "--cached", "--", "events.log"],
                                capture_output=True, text=True).stdout
          events = [json.loads(l[1:]) for l in diff.splitlines()
                    if l.startswith("+") and not l.startswith("+++")]
          created = [e["repo"] for e in events if e["type"] == "created"]
          deleted = [e["repo"] for e in events if e["type"] == "deleted"]
          changed = [e["repo"] for e in events if e["type"] == "changed"]
          bits = []
          if created: bits.append("created " + ", ".join(created))
          if deleted: bits.append("deleted " + ", ".join(deleted))
          if changed: bits.append("changed " + ", ".join(changed))
          print("; ".join(bits) or "index refresh")
          PY
          )"
          git commit -q -m "sync: ${summary}" -m "Recorded by the scheduled reconciliation against ${ORG}."
          git push

          echo "- ${summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the run summary
        run: |
          set -euo pipefail
          {
            echo "### Repository sync"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Repositories | \`$(python3 -c 'import json;print(json.load(open("index.json"))["count"])')\` |"
            echo "| Ledger entries | \`$(wc -l < events.log)\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo
            echo "Deletions stay in \`events.log\` after the index drops them - that is"
            echo "the point of keeping both."
          } >> "$GITHUB_STEP_SUMMARY"
