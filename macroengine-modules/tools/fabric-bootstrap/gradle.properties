org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom is not used here - this is a pure data pack build - but leaving the flag on
# costs nothing and keeps the file identical in shape to the sibling mod project.
org.gradle.configuration-cache=false

# Version stamped into every pack.mcmeta by the renderPackMeta task.
modules_version=1.0.0

# Data pack format for Minecraft 26.3. Also in build.gradle; kept here so a bump
# does not require editing a Kotlin/Groovy file.
pack_format=121
minecraft_version=26.3
